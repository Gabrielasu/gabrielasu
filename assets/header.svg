<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Hi, I'm Gabi. Full-Stack Software Engineer. Enterprise software by day, AI experiments and side projects here.">
  <defs>
    <clipPath id="card"><rect width="1200" height="300" rx="20"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#E3C7D0"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="dotmask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
  </defs>
  <style>
    .serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace}
    .flow{stroke-dasharray:6 120;animation:flow 3.2s linear infinite}
    .f2{animation-delay:-1.1s}.f3{animation-delay:-2.2s}
    @keyframes flow{to{stroke-dashoffset:-126}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}
    .node{animation:glow 3s ease-in-out infinite}
    .n2{animation-delay:-1s}.n3{animation-delay:-2s}
    @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#FBF4F5"/>
    <rect width="1200" height="300" fill="url(#dots)" mask="url(#dotmask)" opacity=".7"/>
    <g filter="url(#blur)" opacity=".9">
      <circle cx="1010" cy="110" r="130" fill="#F3D3DE"/>
      <circle cx="1120" cy="260" r="110" fill="#E7DCF2"/>
    </g>

    <!-- text -->
    <rect x="72" y="88" width="30" height="2" fill="#B5577A"/>
    <text x="114" y="94" class="sans" font-size="14" font-weight="600" letter-spacing="3" fill="#B5577A">FULL-STACK SOFTWARE ENGINEER</text>
    <text x="70" y="168" class="serif" font-size="64" fill="#3B1F2B" letter-spacing="-.5">Hi, I’m Gabi.</text>
    <text x="72" y="212" class="sans" font-size="21" fill="#6E5560">Enterprise software by day, AI experiments and side projects here.</text>
    <text x="72" y="254" class="mono" font-size="15" fill="#9A7584">React  ·  TypeScript  ·  .NET  ·  C#  ·  SQL  ·  Azure</text>

    <!-- network motif -->
    <g fill="none" stroke="#DDB3C2" stroke-width="1.5">
      <circle cx="1010" cy="150" r="104" stroke="#EBCFD9" stroke-dasharray="2 6"/>
      <path d="M950 92 L1062 78 L1112 160 L1042 220 L938 200 Z"/>
      <path d="M1010 150 L950 92 M1010 150 L1062 78 M1010 150 L1112 160 M1010 150 L1042 220 M1010 150 L938 200"/>
    </g>
    <g fill="none" stroke="#B5577A" stroke-width="2.5" stroke-linecap="round">
      <path class="flow" d="M1010 150 L1062 78"/>
      <path class="flow f2" d="M1010 150 L1042 220"/>
      <path class="flow f3" d="M1010 150 L938 200"/>
    </g>
    <circle class="node" cx="950" cy="92" r="6" fill="#C9849C"/>
    <circle class="node n2" cx="1062" cy="78" r="6" fill="#B5577A"/>
    <circle class="node n3" cx="1112" cy="160" r="6" fill="#C9849C"/>
    <circle class="node" cx="1042" cy="220" r="6" fill="#B5577A"/>
    <circle class="node n2" cx="938" cy="200" r="6" fill="#C9849C"/>
    <circle class="pulse" cx="1010" cy="150" r="10" fill="#B5577A"/>
    <circle cx="1010" cy="150" r="10" fill="#3B1F2B"/>
    <circle cx="1010" cy="150" r="3.5" fill="#F3D3DE"/>

    <rect x=".75" y=".75" width="1198.5" height="298.5" rx="19.5" fill="none" stroke="#EBD3DA" stroke-width="1.5"/>
  </g>
</svg>
