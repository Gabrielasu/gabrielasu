<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-label="Terminal: whoami, full-stack software engineer, AI enthusiast, UX nerd. Focus: AI-assisted development, developer tools, thoughtful UX. Stack: React, TypeScript, .NET, C#, SQL, Azure. Top languages on GitHub: TypeScript, Python, JavaScript, HTML, CSS.">
  <style>
    text{font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace}
    @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .c0{animation:type0 0.6s steps(8) 0.4s both}@keyframes type0{from{transform:translateX(0)}to{transform:translateX(96.0px)}}.o1{animation:fade .5s ease-out 1.2s both}.c2{animation:type2 0.8s steps(15) 1.8s both}@keyframes type2{from{transform:translateX(0)}to{transform:translateX(176.5px)}}.o3{animation:fade .5s ease-out 2.8s both}.c4{animation:type4 0.7s steps(12) 3.4s both}@keyframes type4{from{transform:translateX(0)}to{transform:translateX(142.0px)}}.o5{animation:fade .5s ease-out 4.3s both}
    .last{animation:fade .3s 4.9s both}
    .cur{animation:fade .3s 4.9s both,blink 1.1s steps(1) 5.2s infinite}
    @keyframes blink{50%{opacity:0}}
    .o90{animation:fade .5s ease-out .6s both}
    .seg{transform-box:fill-box;transform-origin:left center;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .row{animation:fade .5s ease-out both}
    .glow{animation:glow 6s ease-in-out infinite alternate}
    @keyframes glow{from{transform:translate(0,0)}to{transform:translate(-60px,20px)}}
  </style>
  <defs>
    <clipPath id="cl"><rect width="1200" height="370" rx="16"/></clipPath>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <g clip-path="url(#cl)">
    <rect width="1200" height="370" fill="#1C1118"/>
    <circle class="glow" cx="1080" cy="300" r="120" fill="#2E2448" filter="url(#b)" opacity=".8"/>
    <rect width="1200" height="44" fill="#24161F"/>
    <circle cx="28" cy="22" r="6.5" fill="#E58BAA"/><circle cx="50" cy="22" r="6.5" fill="#B9708C"/><circle cx="72" cy="22" r="6.5" fill="#B9A3E6"/>
    <text x="600" y="27" text-anchor="middle" font-size="14" fill="#A88896">gabi@github: ~</text>
        <text x="40" y="92" font-size="19" xml:space="preserve"><tspan fill="#E58BAA">❯ </tspan><tspan fill="#F6E6EC">whoami</tspan></text>
    <rect class="c0" x="38" y="72" width="100.0" height="28" fill="#1C1118"/>
    <text class="o1" x="40" y="124" font-size="19" xml:space="preserve"><tspan fill="#CDB3BE">full-stack software engineer · ai enthusiast · ux nerd</tspan></text>
    <text x="40" y="172" font-size="19" xml:space="preserve"><tspan fill="#E58BAA">❯ </tspan><tspan fill="#F6E6EC">cat focus.txt</tspan></text>
    <rect class="c2" x="38" y="152" width="180.5" height="28" fill="#1C1118"/>
    <text class="o3" x="40" y="204" font-size="19" xml:space="preserve"><tspan fill="#CDB3BE">ai-assisted development  </tspan><tspan fill="#E58BAA">·</tspan><tspan fill="#CDB3BE">  developer tools  </tspan><tspan fill="#E58BAA">·</tspan><tspan fill="#CDB3BE">  thoughtful ux</tspan></text>
    <text x="40" y="252" font-size="19" xml:space="preserve"><tspan fill="#E58BAA">❯ </tspan><tspan fill="#F6E6EC">ls ./stack</tspan></text>
    <rect class="c4" x="38" y="232" width="146.0" height="28" fill="#1C1118"/>
    <text class="o5" x="40" y="284" font-size="19" xml:space="preserve"><tspan fill="#B9A3E6">react   typescript   .net   c#   sql   azure</tspan></text>
    <text class="o90" x="830" y="92" font-size="19"><tspan fill="#E58BAA">❯ </tspan><tspan fill="#F6E6EC">langs --top</tspan></text>
    <rect class="seg" style="animation-delay:1.00s" x="830.0" y="112" width="104.2" height="10" rx="3" fill="#E58BAA"/>
    <rect class="seg" style="animation-delay:1.15s" x="936.2" y="112" width="80.9" height="10" rx="3" fill="#B9A3E6"/>
    <rect class="seg" style="animation-delay:1.30s" x="1019.1" y="112" width="66.8" height="10" rx="3" fill="#B9708C"/>
    <rect class="seg" style="animation-delay:1.45s" x="1087.9" y="112" width="44.7" height="10" rx="3" fill="#E8B08C"/>
    <rect class="seg" style="animation-delay:1.60s" x="1134.6" y="112" width="13.4" height="10" rx="3" fill="#F6E6EC"/>
    <g class="row" style="animation-delay:1.30s"><circle cx="836" cy="150" r="5" fill="#E58BAA"/><text x="852" y="156" font-size="16" fill="#CDB3BE">TypeScript</text><text x="1150" y="156" font-size="16" text-anchor="end" fill="#A88896">33.2%</text></g>
    <g class="row" style="animation-delay:1.45s"><circle cx="836" cy="182" r="5" fill="#B9A3E6"/><text x="852" y="188" font-size="16" fill="#CDB3BE">Python</text><text x="1150" y="188" font-size="16" text-anchor="end" fill="#A88896">25.9%</text></g>
    <g class="row" style="animation-delay:1.60s"><circle cx="836" cy="214" r="5" fill="#B9708C"/><text x="852" y="220" font-size="16" fill="#CDB3BE">JavaScript</text><text x="1150" y="220" font-size="16" text-anchor="end" fill="#A88896">21.5%</text></g>
    <g class="row" style="animation-delay:1.75s"><circle cx="836" cy="246" r="5" fill="#E8B08C"/><text x="852" y="252" font-size="16" fill="#CDB3BE">HTML</text><text x="1150" y="252" font-size="16" text-anchor="end" fill="#A88896">14.6%</text></g>
    <g class="row" style="animation-delay:1.90s"><circle cx="836" cy="278" r="5" fill="#F6E6EC"/><text x="852" y="284" font-size="16" fill="#CDB3BE">CSS</text><text x="1150" y="284" font-size="16" text-anchor="end" fill="#A88896">4.8%</text></g>
    <rect x="800" y="80" width="1" height="230" fill="#3A2530"/>
    <text class="last" x="40" y="332" font-size="19"><tspan fill="#E58BAA">❯ </tspan></text><rect class="cur" x="64" y="316" width="11" height="21" rx="2" fill="#E58BAA"/>
    <rect x=".75" y=".75" width="1198.5" height="368.5" rx="15.5" fill="none" stroke="#3A2530" stroke-width="1.5"/>
  </g>
</svg>
