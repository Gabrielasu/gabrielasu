<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Thanks for stopping by. Say hi on X at gabigebis.">
  <style>
    .w{animation:drift linear infinite}
    .w1{animation-duration:14s}.w2{animation-duration:20s;animation-direction:reverse}.w3{animation-duration:28s}
    @keyframes drift{to{transform:translateX(-300px)}}
    .t{animation:rise 1s ease-out .2s both}.t2{animation:rise 1s ease-out .6s both}.t3{animation:rise 1s ease-out 1s both}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.8s ease-out 1.6s infinite;opacity:0}
    @keyframes ring{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.18,1.5)}}
    .sp{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
    .s2{animation-delay:-1.3s}.s3{animation-delay:-.6s}
    @keyframes tw{0%,100%{opacity:.3;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
  </style>
  <defs><clipPath id="cl"><rect width="1200" height="210" rx="16"/></clipPath>
  <path id="s" d="M0,-14 C2.2,-2.2 2.2,-2.2 14,0 C2.2,2.2 2.2,2.2 0,14 C-2.2,2.2 -2.2,2.2 -14,0 C-2.2,-2.2 -2.2,-2.2 0,-14Z"/></defs>
  <g clip-path="url(#cl)">
    <rect width="1200" height="210" fill="#FBF4F5"/>
    <path class="w w3" d="M0 170 Q75.0 160 150.0 170 Q225.0 180 300 170 Q375.0 160 450.0 170 Q525.0 180 600 170 Q675.0 160 750.0 170 Q825.0 180 900 170 Q975.0 160 1050.0 170 Q1125.0 180 1200 170 Q1275.0 160 1350.0 170 Q1425.0 180 1500 170 Q1575.0 160 1650.0 170 Q1725.0 180 1800 170 Q1875.0 160 1950.0 170 Q2025.0 180 2100 170 Q2175.0 160 2250.0 170 Q2325.0 180 2400 170 L2400 340 L0 340Z" fill="#E7DCF2" opacity=".9"/>
    <path class="w w2" d="M0 182 Q75.0 171 150.0 182 Q225.0 193 300 182 Q375.0 171 450.0 182 Q525.0 193 600 182 Q675.0 171 750.0 182 Q825.0 193 900 182 Q975.0 171 1050.0 182 Q1125.0 193 1200 182 Q1275.0 171 1350.0 182 Q1425.0 193 1500 182 Q1575.0 171 1650.0 182 Q1725.0 193 1800 182 Q1875.0 171 1950.0 182 Q2025.0 193 2100 182 Q2175.0 171 2250.0 182 Q2325.0 193 2400 182 L2400 340 L0 340Z" fill="#F8E4EA" opacity=".95"/>
    <path class="w w1" d="M0 194 Q75.0 185 150.0 194 Q225.0 203 300 194 Q375.0 185 450.0 194 Q525.0 203 600 194 Q675.0 185 750.0 194 Q825.0 203 900 194 Q975.0 185 1050.0 194 Q1125.0 203 1200 194 Q1275.0 185 1350.0 194 Q1425.0 203 1500 194 Q1575.0 185 1650.0 194 Q1725.0 203 1800 194 Q1875.0 185 1950.0 194 Q2025.0 203 2100 194 Q2175.0 185 2250.0 194 Q2325.0 203 2400 194 L2400 340 L0 340Z" fill="#F3D3DE"/>
    <g class="t2"><text x="600" y="66" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#B5577A">THANKS FOR STOPPING BY</text></g>
    <g class="t3">
      <rect class="ring" x="470" y="88" width="260" height="44" rx="22" fill="none" stroke="#B5577A" stroke-width="2"/>
      <rect x="470" y="88" width="260" height="44" rx="22" fill="#3B1F2B"/>
      <g transform="translate(496 101) scale(.75)"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z" fill="#FBF4F5"/></g>
      <text x="528" y="116" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#FBF4F5">say hi @gabigebis</text>
    </g>
    <g transform="translate(370 60)"><use href="#s" class="sp" fill="#B5577A"/></g>
    <g transform="translate(830 60)"><use href="#s" class="sp s2" fill="#9C84C9"/></g>
    <g transform="translate(760 108)"><use href="#s" class="sp s3" fill="#C9849C"/></g>
  </g>
</svg>
